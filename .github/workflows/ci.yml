name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, typecheck, build, cross-browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify production foundation
        run: npm run check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Sprite lab Chromium dev-server interaction
        run: npm run test:sprite:browser

      # Keep visual A/B/C evidence even on success, so a human can review
      # the actual Babylon-cabin renders without relying on mock screenshots.
      - name: Upload sprite comparison screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sprite-comparison-visuals
          path: |
            test-results/**/spritesheet.png
            test-results/**/layered.png
            test-results/**/hybrid.png
          if-no-files-found: ignore
          retention-days: 5

      - name: Cross-browser smoke
        run: npm run test:browser

      # Preserve failing Playwright traces/screenshots for root-cause analysis.
      # No test, browser, retry, or product-performance thresholds are relaxed.
      - name: Upload browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 3
