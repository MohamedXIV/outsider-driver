name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, typecheck, build, cross-browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify production foundation
        run: npm run check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Cross-browser smoke
        run: npm run test:browser

      # Branch-scoped art capture AFTER browser smoke to isolate CI browser load.
      # A real Vite/Chromium screenshot, not a generated illustration.
      # Limit this to the visual-review branch, not every normal PR.
      - name: Capture Docks taxi-camera art evidence
        if: ${{ always() && github.event_name == 'pull_request' && github.head_ref == 'feat/70-docks-authored-scenery' }}
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/outsider-docks-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS -o /dev/null http://127.0.0.1:5173/; then break; fi
            sleep 1
          done
          TAXI_CAPTURE_OUTPUT=docs/visuals/80 node scripts/capture-taxi-scene.mjs > docs/visuals-80-metrics.json
          TAXI_MATERIAL_OUTPUT=docs/visuals/80-material-compare node scripts/capture-docks-material-comparison.mjs > docs/visuals-80-material-compare-metrics.json

      - name: Upload Docks art evidence
        if: ${{ always() && github.event_name == 'pull_request' && github.head_ref == 'feat/70-docks-authored-scenery' }}
        uses: actions/upload-artifact@v4
        with:
          name: docks-taxi-camera-art-evidence
          path: |
            docs/visuals/80/
            docs/visuals-80-metrics.json
            docs/visuals/80-material-compare/
            docs/visuals-80-material-compare-metrics.json
          if-no-files-found: warn
          retention-days: 3

      # Preserve failing Playwright traces/screenshots for root-cause analysis.
      # No test, browser, retry, or product-performance thresholds are relaxed.
      - name: Upload browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 3
