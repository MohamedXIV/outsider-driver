name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, typecheck, build, cross-browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify production foundation
        run: npm run check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Cross-browser smoke
        run: npm run test:browser

      - name: Capture real Pixi Patchworks lab (branch-only art proof)
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/86-pixi-patchworks-lab' }}
        run: node scripts/capture-patchworks-lab.mjs

      - name: Archive Pixi animated scene screenshots and frame diagnostics
        if: ${{ always() && github.event_name == 'pull_request' && github.head_ref == 'feat/86-pixi-patchworks-lab' }}
        uses: actions/upload-artifact@v4
        with:
          name: patchworks-real-pixi-browser-art
          path: docs/visuals/pixi-patchworks/
          if-no-files-found: warn
          retention-days: 3
