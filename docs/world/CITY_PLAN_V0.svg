<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Outsider Driver — provisional aerial city-layout map, v0</title>
<desc id="desc">Top-down diagram of an alien self-governing charter-port city with six draft districts. Physical cargo basin west, the docks southwest, worker belt northwest, historic junction center, civic core east, rich upper terraces northeast and outer margin southeast. Roads, supported viaducts and checkpoints connect sectors. Not a navigable open world or an approved canon map.</desc>
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0e6ce"/><stop offset="1" stop-color="#d5c8a7"/></linearGradient>
 <linearGradient id="sea" x1="0" y1="0" x2="1" y2=".6"><stop stop-color="#153c50"/><stop offset="1" stop-color="#37798a"/></linearGradient>
 <pattern id="streetGrid" width="36" height="38" patternUnits="userSpaceOnUse"><path d="M36 0H0V38" fill="none" stroke="#7a7b68" stroke-opacity=".17" stroke-width="2"/></pattern>
 <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="1" dy="3" stdDeviation="4" flood-opacity=".15"/></filter>
 <style>
 text{font-family:Arial,Helvetica,sans-serif} .district{fill:#203e42;font-weight:bold;font-size:21px;letter-spacing:1.1px;paint-order:stroke fill;stroke:#eadcbe;stroke-width:3px}
 .sub{fill:#365458;font-size:14px;font-weight:600;paint-order:stroke fill;stroke:#e8d9ba;stroke-width:3px}
 .minor{fill:#f1e3c1;font-size:13px;font-weight:700;paint-order:stroke fill;stroke:#33515c;stroke-width:3px}
 .note{font-size:15px;fill:#355159} .boxText{fill:#274149;font-size:15px;font-weight:600}
 </style>
</defs>
